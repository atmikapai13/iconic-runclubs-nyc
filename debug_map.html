<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Map</title>
    <link rel="stylesheet" href="https://js.arcgis.com/4.27/esri/themes/light/main.css">
    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script src="https://js.arcgis.com/4.27/"></script>
    <script src="run_clubs_data.js"></script>
    
    <script>
        console.log("Debug: Starting map initialization");
        console.log("Debug: locations array length:", locations ? locations.length : "undefined");
        
        if (locations && locations.length > 0) {
            console.log("Debug: First location:", locations[0]);
        }
        
        require([
            "esri/Map",
            "esri/views/MapView",
            "esri/Graphic",
            "esri/layers/GraphicsLayer",
            "esri/symbols/SimpleMarkerSymbol"
        ], function(Map, MapView, Graphic, GraphicsLayer, SimpleMarkerSymbol) {
            
            console.log("Debug: ArcGIS modules loaded");
            
            // Create map
            var map = new Map({
                basemap: "streets-navigation-vector"
            });

            // Create view
            var view = new MapView({
                container: "map",
                map: map,
                zoom: 10,
                center: [-74.0060, 40.7128], // New York City coordinates
                constraints: {
                    rotationEnabled: false,
                    snapToZoom: false
                },
                ui: {
                    components: ["attribution"]
                }
            });

            console.log("Debug: Map and view created");

            // Create graphics layer for markers
            var graphicsLayer = new GraphicsLayer();
            map.add(graphicsLayer);

            console.log("Debug: Graphics layer added");

            // Borough colors
            var boroughColors = {
                'Bronx': [255, 0, 0, 0.8],      // Red
                'Brooklyn': [0, 0, 255, 0.8],   // Blue
                'Manhattan': [0, 255, 0, 0.8],  // Green
                'Queens': [255, 165, 0, 0.8],   // Orange
                'Staten Island': [128, 0, 128, 0.8] // Purple
            };

            // Add markers to map
            console.log("Debug: Starting to add markers");
            var markerCount = 0;
            
            locations.forEach(function(location) {
                var color = boroughColors[location.Borough] || [128, 128, 128, 0.8];
                
                var markerSymbol = new SimpleMarkerSymbol({
                    color: color,
                    outline: {
                        color: [255, 255, 255, 0.8],
                        width: 2
                    },
                    size: 12
                });

                var point = {
                    type: "point",
                    longitude: location.longitude,
                    latitude: location.latitude
                };

                var graphic = new Graphic({
                    geometry: point,
                    symbol: markerSymbol,
                    attributes: location
                });

                graphicsLayer.add(graphic);
                markerCount++;
                
                if (markerCount <= 3) {
                    console.log("Debug: Added marker", markerCount, "for", location.RunClubName, "at", location.longitude, location.latitude);
                }
            });

            console.log("Debug: Total markers added:", markerCount);
            console.log("Debug: Graphics layer count:", graphicsLayer.graphics.length);
            
            // Add click event to view
            view.on("click", function(event) {
                view.hitTest(event).then(function(response) {
                    if (response.results.length > 0) {
                        var graphic = response.results[0].graphic;
                        if (graphic && graphic.attributes) {
                            console.log("Debug: Clicked on:", graphic.attributes.RunClubName);
                        }
                    }
                });
            });

            console.log("Debug: Map initialization complete");
        });
    </script>
</body>
</html>

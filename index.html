<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="myflav.webp">
    <title>NYC Run Clubs Map - ArcGIS</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- ArcGIS Maps SDK for JavaScript -->
    <link rel="stylesheet" href="https://js.arcgis.com/4.27/esri/themes/light/main.css">
    
    <style> 
        #map {
            height: 100vh;
            width: 100%;
        }
        .filter-controls {
            position: absolute;
            top: 60px;
            left: 10px;
            z-index: 1;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            width: 20%;
            min-width: 180px; 
        }
        .meeting-times {
            text-align: center;
            margin: 0 auto;
            max-width: 60%;
        }
        .filter-label {
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 3px;
        }
        .filter-section {
            margin-bottom: 10px;
        }
        .esri-view {
            height: 100vh;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-white fixed-top">
        <span class="navbar-brand mb-0 h1 mx-auto text-dark">Iconic NYC Run Clubs</span>
    </nav>
    <footer class="navbar navbar-light bg-white fixed-bottom">
        <div class="container text-center d-flex flex-column">
            <span class="navbar-brand mb-0 h5 mx-auto text-dark" style="font-size: 12px;">
               By <a href="https://atmikapai.dev/" target="_blank" style="color: inherit;">Atmika Pai</a>
            </span>
            <div style="font-size: 8px; margin-top: -8px;">
                <span>Inspired by <a href="https://www.iconicsandwiches.com/" target="_blank" style="color: inherit;">Dan Dewitz's Iconic Sandwiches</a></span>
                <span class="mx-1">|</span>
                <span><a href="https://docs.google.com/spreadsheets/d/1QFRce-siqNQsuTEtmCf4zg5uE0W4fTPdJjEDbDVNRLQ/edit?usp=sharing" target="_blank" style="color: inherit;">Original Run Club List</a></span>
                <span class="mx-1">|</span>
                <span>Map: <a href="https://www.esri.com/" target="_blank" style="color: inherit;">© Esri</a> (<a href="https://developers.arcgis.com/javascript/latest/" target="_blank" style="color: inherit;">ArcGIS Maps SDK)</a></span>
            </div>
        </div>
    </footer>

    <!-- Filter Controls -->
    <div class="filter-controls">
        <h6 class="mb-2">Filters</h6>
        
        <div class="filter-section">
            <label for="boroughFilter" class="filter-label">Borough</label>
            <select id="boroughFilter" class="form-control form-control-sm">
                <option value="all">All Boroughs</option>
                <option value="Bronx">Bronx</option>
                <option value="Brooklyn">Brooklyn</option>
                <option value="Manhattan">Manhattan</option>
                <option value="Queens">Queens</option>
                <option value="Staten Island">Staten Island</option>
            </select>
        </div>
        
        <div class="filter-section">
            <label for="dayTypeFilter" class="filter-label">Weekday/Weekend</label>
            <select id="dayTypeFilter" class="form-control form-control-sm">
                <option value="all">All Days</option>
                <option value="Both">Both</option>
                <option value="Weekend">Weekend</option>
                <option value="Weekday">Weekday</option>
            </select>
        </div>
        
        <div class="filter-section">
            <label for="dayFilter" class="filter-label">Specific Day</label>
            <select id="dayFilter" class="form-control form-control-sm">
                <option value="all">Any Day</option>
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
                <option value="Sunday">Sunday</option>
            </select>
        </div>
        
        <div class="filter-section">
            <label for="timeFilter" class="filter-label">Time of Day</label>
            <select id="timeFilter" class="form-control form-control-sm">
                <option value="all">Any Time</option>
                <option value="morning">Morning (Before 12PM)</option>
                <option value="afternoon">Afternoon (12-5PM)</option>
                <option value="evening">Evening (After 5PM)</option>
            </select>
        </div>

        <div class="text-left" style="font-size: 10px; color: #999999;  transform-origin: left top;">
            Showing <span id="visibleCount">0</span> of <span id="totalCount">0</span> clubs
        </div>
        
        <button id="resetFilters" class="btn btn-sm btn-outline-secondary mt-2">Reset Filters</button>
    </div>

    <div id="map"></div>

    <!-- Bootstrap Modal -->
    <div class="modal fade" id="infoModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal" role="document">
            <div class="modal-content">
                <div class="modal-header w-100 d-flex flex-column align-items-center">
                                            <h3 id="runClubName" class="font-weight-bold mb-1 text-center"></h3>
                        <h5 id="address" class="mt-2 text-center mb-0"></h5>
                        <h5 id="borough" class="mt-2 text-center"></h5>
                    <button type="button" class="close position-absolute" style="right: 15px; top: 15px;" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="modal-body text-center">
                                                                    <p id="getDirections" class="text-center mb-3"></p>

                    <p id="distance" class="mt-1 mb-1 text-center"></p>
                    <div id="meetingTimes" class="mt-1 mb-3 meeting-times"></div>
                    <p id="clubWebsite" class="mb-3 text-center"></p>
                </div>

                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-outline-dark btn-block w-75" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    
    <!-- ArcGIS Script -->
    <script src="https://js.arcgis.com/4.27/"></script>
    
    <!-- Run Clubs Data -->
    <script src="run_clubs_data.js"></script>
    
    <script>

        // Initialize map when ArcGIS is loaded
        require([
            "esri/Map",
            "esri/views/MapView",
            "esri/Graphic",
            "esri/layers/GraphicsLayer",
            "esri/symbols/PictureMarkerSymbol",
            "esri/widgets/Home"
        ], function(Map, MapView, Graphic, GraphicsLayer, PictureMarkerSymbol, Home) {
            
            // Create map
            var map = new Map({
                basemap: "streets-navigation-vector" //topo-vector
            });

            // Create view
            var view = new MapView({
                container: "map",
                map: map,
                zoom: 10,
                center: [-74.0060, 40.7328], // New York City coordinates
                constraints: {
                    rotationEnabled: false,
                    snapToZoom: false
                },
                ui: {
                    components: ["attribution"]
                }
            });

            // Create graphics layer for markers
            var graphicsLayer = new GraphicsLayer();
            map.add(graphicsLayer);



            // Add widgets to the map (right side)
            var homeWidget = new Home({
                view: view
            });
            view.ui.add(homeWidget, "top-right");

            // Add markers to map
            locations.forEach(function(location) {
                var markerSymbol = new PictureMarkerSymbol({
                    url: "running-run.svg",
                    width: 12,
                    height: 14
                });

                var point = {
                    type: "point",
                    longitude: location.longitude,
                    latitude: location.latitude
                };

                var graphic = new Graphic({
                    geometry: point,
                    symbol: markerSymbol,
                    attributes: location
                });

                graphicsLayer.add(graphic);
            });

            // Update counters
            document.getElementById('totalCount').textContent = locations.length;
            document.getElementById('visibleCount').textContent = locations.length;

            // Filter functionality
            function applyFilters() {
                var boroughFilter = document.getElementById('boroughFilter').value;
                var dayTypeFilter = document.getElementById('dayTypeFilter').value;
                var dayFilter = document.getElementById('dayFilter').value;
                var timeFilter = document.getElementById('timeFilter').value;

                var visibleCount = 0;

                graphicsLayer.graphics.forEach(function(graphic) {
                    var location = graphic.attributes;
                    var visible = true;

                    // Borough filter
                    if (boroughFilter !== 'all' && location.Borough !== boroughFilter) {
                        visible = false;
                    }

                    // Day type filter
                    if (dayTypeFilter !== 'all' && location.DayType !== dayTypeFilter) {
                        visible = false;
                    }

                    // Day filter
                    if (dayFilter !== 'all' && !location.Days.includes(dayFilter)) {
                        visible = false;
                    }

                    // Time filter
                    if (timeFilter !== 'all') {
                        var time = location.Times;
                        if (timeFilter === 'morning' && !time.includes('AM')) {
                            visible = false;
                        } else if (timeFilter === 'afternoon' && !time.includes('12') && !time.includes('1') && !time.includes('2') && !time.includes('3') && !time.includes('4')) {
                            visible = false;
                        } else if (timeFilter === 'evening' && !time.includes('PM') && !time.includes('5') && !time.includes('6') && !time.includes('7') && !time.includes('8') && !time.includes('9')) {
                            visible = false;
                        }
                    }

                    graphic.visible = visible;
                    if (visible) visibleCount++;
                });

                document.getElementById('visibleCount').textContent = visibleCount;
            }

            // Add click event to view
            view.on("click", function(event) {
                view.hitTest(event).then(function(response) {
                    if (response.results.length > 0) {
                        var graphic = response.results[0].graphic;
                        if (graphic && graphic.attributes && graphic.attributes.RunClubName) {
                            console.log("Clicked on run club:", graphic.attributes.RunClubName);
                            showInfoModal(graphic.attributes);
                        } else {
                            console.log("Clicked on something else, not a run club marker");
                        }
                    } else {
                        console.log("Clicked on empty space");
                    }
                });
            });

            // Add event listeners
            document.getElementById('boroughFilter').addEventListener('change', applyFilters);
            document.getElementById('dayTypeFilter').addEventListener('change', applyFilters);
            document.getElementById('dayFilter').addEventListener('change', applyFilters);
            document.getElementById('timeFilter').addEventListener('change', applyFilters);

            document.getElementById('resetFilters').addEventListener('click', function() {
                document.getElementById('boroughFilter').value = 'all';
                document.getElementById('dayTypeFilter').value = 'all';
                document.getElementById('dayFilter').value = 'all';
                document.getElementById('timeFilter').value = 'all';
                applyFilters();
            });

            // Show info modal function
            function showInfoModal(location) {
                console.log("Location data:", location); // Debug log
                
                document.getElementById('runClubName').textContent = location.RunClubName || 'Unknown Club';
                document.getElementById('borough').textContent = location.Borough || 'Unknown Borough';
                document.getElementById('address').textContent = location.Address || 'Address not available';

                document.getElementById('distance').innerHTML = location.Distance ? '<strong>Distance:</strong> ' + location.Distance : '';
                document.getElementById('meetingTimes').innerHTML = '<strong>Days:</strong> ' + (location.Days || 'Check website') + '<br><strong>Times:</strong> ' + (location.Times || 'Check website');
                document.getElementById('clubWebsite').innerHTML = '<a href="' + location.Website + '" target="_blank" class="btn btn-primary btn-sm">Visit Website</a>';
                
                $('#infoModal').modal('show');
            }

            console.log("ArcGIS Map loaded successfully!");
        });
    </script>
</body>
</html>

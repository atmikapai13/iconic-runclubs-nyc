<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="myflav.webp">
    <title>Loading NYC Run Clubs Map</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .loading-container {
            text-align: center;
        }

        .loading-gif {
            width: 200px;
            height: 200px;
            margin-bottom: 20px;
        }

        .loading-text {
            font-size: 24px;
            color: #333;
            margin-top: 20px;
        }

        .loading-dots {
            display: inline-block;
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <img src="running_man.gif" alt="Running Animation" class="loading-gif">
        <div class="loading-text">
            Loading NYC Run Clubs<span class="loading-dots">...</span>
        </div>
    </div>

    <script>
        // Redirect to the main page after 3 seconds
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 3000);
    </script>
</body>
</html>
